name: apply-docidentity-docs

on:
  push:
    branches: [imp/docidentity001-visible-managed-id]
    paths: [.github/workflows/apply-docidentity-docs.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp/docidentity001-visible-managed-id
      - name: Insert managed identity contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('docs/managed-documents.md')
          text = path.read_text()
          anchor = '## Concurrency and idempotency model\n'
          if text.count(anchor) != 1:
            raise SystemExit(f'expected one documentation anchor, found {text.count(anchor)}')
          section = '''## Visible logical document identity\n\nProject-OS-authored Markdown work products expose their authoritative logical identity directly in YAML frontmatter:\n\n```yaml\n---\nproject_id: PRJ-0003\ndocument_id: DOC-08B3524AC1CB4D6AE7079816\n---\n```\n\nThe hidden Managed Documents ledger remains authoritative. `document_id` identifies the logical document; it is not a task ID, decision ID, provider file ID or immutable version ID. Existing metadata such as `task_id` may coexist with it. A visible `project_id` or `document_id` that disagrees with the governed head is treated as an identity conflict and is never silently adopted. Reconciliation permits missing identity only for historical/pre-feature Markdown so deployment does not trigger a bulk rewrite.\n\nFor a Project-OS-authored Markdown write, ordering is deliberate: validate the caller-supplied SHA-256 against the caller bytes, resolve the authoritative logical identity, enrich the Markdown, compute SHA-256 of the enriched bytes, then store and materialize those exact enriched bytes. The immutable version record therefore hashes the same bytes that recovery can later replay. Non-Markdown content and managed REFERENCES remain byte-preserving.\n\nWORKING → REVIEW → DELIVERABLES promotion does not change `document_id`; new immutable versions change `version_id`. Initial compatibility allocation may still derive a `DOC-...` value from `project_id + initial logical_path`, but after the head exists the stored `document_id` is authoritative. A future governed rename must mutate `logical_path` while preserving that identity; IMP-DOCIDENTITY001 does not introduce a rename API.\n\nThe legacy artifact API follows the same rule for governed Markdown routed to `DELIVERABLES/`: visible bytes and immutable payload evidence contain the authoritative identity. Historical documents are enriched lazily on a governed rewrite/republication rather than mass-rewritten during deployment. REVIEW active-head/supersession cleanup is a separate lifecycle concern.\n\n'''
          text = text.replace(anchor, section + anchor, 1)
          path.write_text(text)
          PY
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/managed-documents.md
          git diff --cached --check
          git commit -m "docs: document visible managed identity contract"
          git push origin HEAD:imp/docidentity001-visible-managed-id

name: apply-docidentity-legacy-patch

on:
  push:
    branches: [imp/docidentity001-visible-managed-id]
    paths: [.github/workflows/apply-docidentity-legacy-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp/docidentity001-visible-managed-id
      - name: Apply asserted legacy patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/documents/legacy-artifact.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
            global text
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one {label} anchor, found {count}: {old[:120]!r}')
            text = text.replace(old, new, 1)

          replace_once(
            'import { ManagedDocumentBootstrapper } from "./bootstrap";\nimport { sha256Text } from "./hash";',
            'import { ManagedDocumentBootstrapper } from "./bootstrap";\nimport { sha256Text } from "./hash";\nimport { enforceManagedMarkdownIdentity } from "./identity-frontmatter";',
            'identity import'
          )

          replace_once(
            '    const payloadPath = await this.ledger.storeTextPayload(request.project_id, request.content_sha256, request.content);\n    return managed.zone === "deliverables"\n      ? this.writePublished(state, request, managed, payloadPath)\n      : this.writeReference(state, request, managed, payloadPath);',
            '    if (managed.zone === "deliverables") {\n      return this.writePublished(state, request, managed);\n    }\n    const payloadPath = await this.ledger.storeTextPayload(request.project_id, request.content_sha256, request.content);\n    return this.writeReference(state, request, managed, payloadPath);',
            'managed branch payload routing'
          )

          replace_once(
            '    destination: Extract<ManagedArtifactDestination, { zone: "deliverables" }>,\n    payloadPath: string\n  ): Promise<LegacyManagedArtifactWriteResult> {\n    const documentId = await documentIdFor(request.project_id, destination.logicalPath);\n    const versionId = await legacyVersionIdFor(request.request_id, "published");\n    const replay = await this.ledger.readVersion(request.project_id, documentId, versionId);\n    if (replay) return this.validateReplay(replay, request, destination.path);',
            '    destination: Extract<ManagedArtifactDestination, { zone: "deliverables" }>\n  ): Promise<LegacyManagedArtifactWriteResult> {\n    const documentId = await documentIdFor(request.project_id, destination.logicalPath);\n    const managedContent = enforceManagedMarkdownIdentity(request.content, {\n      projectId: request.project_id,\n      documentId,\n      logicalPath: destination.logicalPath\n    });\n    const managedContentSha256 = await sha256Text(managedContent);\n    const payloadPath = await this.ledger.storeTextPayload(request.project_id, managedContentSha256, managedContent);\n    const versionId = await legacyVersionIdFor(request.request_id, "published");\n    const replay = await this.ledger.readVersion(request.project_id, documentId, versionId);\n    if (replay) return this.validateReplay(replay, request, destination.path, managedContentSha256);',
            'published setup'
          )

          replace_once(
            '    if (metadata && currentContent === request.content) {\n      if (\n        sameObservation(head?.provider?.published, metadata)\n        && await this.activeVersionProvesLegacyContent(head, "published", request.content_sha256)\n      ) return "idempotent";\n      await this.persistPublishedVersion(request, destination, payloadPath, documentId, versionId, head, metadata);\n      return "idempotent";\n    }',
            '    if (metadata && currentContent === managedContent) {\n      if (\n        sameObservation(head?.provider?.published, metadata)\n        && await this.activeVersionProvesLegacyContent(head, "published", managedContentSha256)\n      ) return "idempotent";\n      await this.persistPublishedVersion(request, destination, payloadPath, managedContentSha256, documentId, versionId, head, metadata);\n      return "idempotent";\n    }',
            'published idempotency'
          )

          replace_once(
            '      metadata = await this.conditionalReplace(\n        destination.path,\n        request.content,\n        requireDropboxV1Evidence(metadata).rev\n      );\n    } else {\n      metadata = await this.createVisible(destination.path, request.content);\n    }\n\n    await this.persistPublishedVersion(request, destination, payloadPath, documentId, versionId, head, metadata);',
            '      metadata = await this.conditionalReplace(\n        destination.path,\n        managedContent,\n        requireDropboxV1Evidence(metadata).rev\n      );\n    } else {\n      metadata = await this.createVisible(destination.path, managedContent);\n    }\n\n    await this.persistPublishedVersion(request, destination, payloadPath, managedContentSha256, documentId, versionId, head, metadata);',
            'published visible write'
          )

          replace_once(
            '    payloadPath: string,\n    documentId: string,\n    versionId: string,',
            '    payloadPath: string,\n    contentSha256: string,\n    documentId: string,\n    versionId: string,',
            'published persistence signature'
          )

          replace_once(
            '      immutable_payload_path: payloadPath,\n      content_sha256: request.content_sha256,\n      provider_content_hash: evidence.content_hash,',
            '      immutable_payload_path: payloadPath,\n      content_sha256: contentSha256,\n      provider_content_hash: evidence.content_hash,',
            'published persistence hash'
          )

          replace_once(
            '  private validateReplay(\n    record: DocumentVersionRecord,\n    request: ArtifactWriteRequest,\n    path: string\n  ): LegacyManagedArtifactWriteResult {\n    if (record.source !== "legacy_artifact_api" || record.content_sha256 !== request.content_sha256 || record.request_id !== request.request_id) {',
            '  private validateReplay(\n    record: DocumentVersionRecord,\n    request: ArtifactWriteRequest,\n    path: string,\n    expectedContentSha256 = request.content_sha256\n  ): LegacyManagedArtifactWriteResult {\n    if (record.source !== "legacy_artifact_api" || record.content_sha256 !== expectedContentSha256 || record.request_id !== request.request_id) {',
            'replay expected hash'
          )

          path.write_text(text)
          PY
      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/documents/legacy-artifact.ts
          git diff --cached --check
          git commit -m "feat: enrich legacy managed Markdown identity"
          git push origin HEAD:imp/docidentity001-visible-managed-id

name: apply-docidentity-reconcile-patch

on:
  push:
    branches: [imp/docidentity001-visible-managed-id]
    paths: [.github/workflows/apply-docidentity-reconcile-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: imp/docidentity001-visible-managed-id
      - name: Apply asserted reconciler patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/documents/reconciler.ts')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
            global text
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one {label} anchor, found {count}: {old[:120]!r}')
            text = text.replace(old, new, 1)

          replace_once(
            'import { DocumentLedgerRepository, type ReferenceFingerprintRecord } from "./repository";',
            'import {\n  ManagedDocumentIdentityConflictError,\n  assertManagedMarkdownIdentityIfPresent\n} from "./identity-frontmatter";\nimport { DocumentLedgerRepository, type ReferenceFingerprintRecord } from "./repository";',
            'identity import'
          )

          replace_once(
            '      if (classified.zone === "working" || classified.zone === "review") {\n        const captured = await this.captureWorkProductEdit(\n          state,\n          classified.zone,\n          classified.relativePath,\n          change.path,\n          metadata\n        );\n        summary.captured += captured ? 1 : 0;\n        summary.ignored += captured ? 0 : 1;\n        continue;\n      }',
            '      if (classified.zone === "working" || classified.zone === "review") {\n        const identityConflict = await this.hasVisibleIdentityConflict(\n          state,\n          classified.relativePath,\n          change.path\n        );\n        if (identityConflict) {\n          summary.conflicts += 1;\n          continue;\n        }\n        const captured = await this.captureWorkProductEdit(\n          state,\n          classified.zone,\n          classified.relativePath,\n          change.path,\n          metadata\n        );\n        summary.captured += captured ? 1 : 0;\n        summary.ignored += captured ? 0 : 1;\n        continue;\n      }',
            'working review dispatch'
          )

          anchor = '  private async captureWorkProductEdit(\n'
          if text.count(anchor) != 1:
            raise SystemExit(f'Expected exactly one captureWorkProductEdit anchor, found {text.count(anchor)}')
          helper = '''  private async hasVisibleIdentityConflict(\n    state: ProjectState,\n    logicalPath: string,\n    visiblePath: string\n  ): Promise<boolean> {\n    const documentId = await documentIdFor(state.project_id, logicalPath);\n    const head = await this.ledger.readHead(state.project_id, documentId);\n    if (!head || head.kind !== "work_product") return false;\n\n    const content = await this.runtime.objects.readText(visiblePath);\n    if (content === null) return false;\n    try {\n      assertManagedMarkdownIdentityIfPresent(content, {\n        projectId: state.project_id,\n        documentId: head.document_id,\n        logicalPath: head.logical_path\n      });\n      return false;\n    } catch (error) {\n      if (error instanceof ManagedDocumentIdentityConflictError) return true;\n      throw error;\n    }\n  }\n\n'''
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)
          PY
      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/documents/reconciler.ts
          git diff --cached --check
          git commit -m "feat: reject forged managed identity on reconciliation"
          git push origin HEAD:imp/docidentity001-visible-managed-id

name: ci

on:
  push:
    branches: [main, feat/project-os-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce GitHub-hosted runners only
        shell: bash
        run: |
          needle="self""-hosted"
          if grep -R -n -F "$needle" .github/workflows; then
            echo "Project OS workflows must use GitHub-hosted runners only."
            exit 1
          fi
      - run: npm install
      - name: Run project checks
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee ci-check.log
      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-check-log-${{ github.sha }}
          path: ci-check.log
          if-no-files-found: ignore
      - run: npm run test:persistence-high-risk
      - run: npx wrangler deploy --dry-run

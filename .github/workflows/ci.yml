name: ci

on:
  push:
    branches: [main, feat/project-os-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce GitHub-hosted runners only
        shell: bash
        run: |
          needle="self""-hosted"
          if grep -R -n -F "$needle" .github/workflows; then
            echo "Project OS workflows must use GitHub-hosted runners only."
            exit 1
          fi
      - run: npm install
      - name: Diagnostic — IMP-INDEX001 search index store
        run: npx vitest run test/search-index-store.spec.ts --reporter=verbose
      - name: Diagnostic — report only failing full-suite tests
        shell: bash
        run: |
          set +e
          npx vitest run --reporter=json --outputFile=/tmp/vitest.json
          code=$?
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/vitest.json', 'utf8'));
          const results = Array.isArray(report.testResults) ? report.testResults : [];
          const failedSuites = results.filter((suite) =>
            suite.status === 'failed' || (suite.assertionResults || []).some((test) => test.status === 'failed')
          );
          console.log('=== FAILED TESTS ONLY ===');
          for (const suite of failedSuites) {
            console.log(`FILE: ${suite.name || suite.testFilePath || '<unknown>'}`);
            for (const test of suite.assertionResults || []) {
              if (test.status !== 'failed') continue;
              console.log(`TEST: ${(test.ancestorTitles || []).concat(test.title || test.fullName || []).filter(Boolean).join(' > ')}`);
              for (const message of test.failureMessages || []) console.log(message);
            }
            if (suite.message) console.log(suite.message);
          }
          console.log(`FAILED_SUITE_COUNT=${failedSuites.length}`);
          NODE
          exit "$code"
      - run: npm run check
      - run: npm run test:persistence-high-risk
      - run: npx wrangler deploy --dry-run

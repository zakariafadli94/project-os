name: ci

on:
  push:
    branches: [main, feat/project-os-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce GitHub-hosted runners only
        shell: bash
        run: |
          needle="self""-hosted"
          if grep -R -n -F "$needle" .github/workflows; then
            echo "Project OS workflows must use GitHub-hosted runners only."
            exit 1
          fi
      - run: npm ci
      - name: Generate Worker types
        run: npm run types
      - name: Typecheck
        run: npm run typecheck
      - name: Check persistence boundary
        run: npm run check:persistence-boundary
      - name: Check production promotion authority
        run: npm run check:production-promotion-authority
      - name: Check mutation gate repair workflow
        run: npm run check:mutation-gate-repair-workflow
      - name: Check INDEX001 remediation
        run: npm run check:index001-remediation
      - name: Check binary artifact ingress
        run: npm run check:binary-artifact-ingress
      - name: Check recovery workflow
        run: npm run check:recover-inputs-workflow
      - name: Test encrypted fallback ingress
        run: npx vitest run test/fallback-ingress.spec.ts
      - name: Test fallback relay workflow specification
        run: npx vitest run test/fallback-ingress-relay-workflow.spec.ts
      - run: npm run test:index001
      - run: npm run check:persistence-boundary
      - run: npm run test:persistence-high-risk
      - name: Test recovery admin API
        run: npm run test:recover-inputs-api
      - name: Test recovery workflow specification
        run: npm run test:recover-inputs-workflow-spec
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run

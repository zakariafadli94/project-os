name: ci

on:
  push:
    branches: [main, feat/project-os-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce GitHub-hosted runners only
        shell: bash
        run: |
          needle="self""-hosted"
          if grep -R -n -F "$needle" .github/workflows; then
            echo "Project OS workflows must use GitHub-hosted runners only."
            exit 1
          fi
      - run: npm ci
      - run: npm run test:index001
      - run: npm run check:persistence-boundary
      - run: npm run test:persistence-high-risk
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run

name: deploy-control-tower

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit SHA approved for the Control Tower deployment
        required: true
        type: string
      confirm_control_tower:
        description: Type DEPLOY_CONTROL_TOWER
        required: true
        type: string

concurrency:
  group: project-os-control-tower-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact reviewed main commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm_control_tower }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "DEPLOY_CONTROL_TOWER"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${EXPECTED_SHA,,}" = "${GITHUB_SHA,,}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete repository gate
        run: npm run check

      - name: Request deployment from the sole production promoter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            --data "{\"ref\":\"main\",\"inputs\":{\"expected_sha\":\"${GITHUB_SHA}\",\"confirm_production\":\"DEPLOY\",\"deployment_target\":\"control_tower\"}}"

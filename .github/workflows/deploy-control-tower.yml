name: deploy-control-tower

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit SHA approved for the Control Tower deployment
        required: true
        type: string
      confirm_control_tower:
        description: Type DEPLOY_CONTROL_TOWER
        required: true
        type: string

concurrency:
  group: project-os-control-tower-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_CLIENT_ID: ${{ secrets.CONTROL_TOWER_GITHUB_CLIENT_ID }}
      GITHUB_CLIENT_SECRET: ${{ secrets.CONTROL_TOWER_GITHUB_CLIENT_SECRET }}
      OAUTH_COOKIE_ENCRYPTION_KEY: ${{ secrets.CONTROL_TOWER_COOKIE_KEY }}
      CONTROL_TOWER_URL: https://project-os-control-tower.zakaria-fadli-94.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact reviewed main commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm_control_tower }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRM" = "DEPLOY_CONTROL_TOWER"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          test "${EXPECTED_SHA,,}" = "${GITHUB_SHA,,}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact dependencies
        run: npm ci

      - name: Run complete repository gate
        run: npm run check

      - name: Configure Control Tower OAuth secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GITHUB_CLIENT_ID"
          test -n "$GITHUB_CLIENT_SECRET"
          test -n "$OAUTH_COOKIE_ENCRYPTION_KEY"
          printf '%s' "$GITHUB_CLIENT_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET --config wrangler.control-tower.jsonc
          printf '%s' "$OAUTH_COOKIE_ENCRYPTION_KEY" | npx wrangler secret put OAUTH_COOKIE_ENCRYPTION_KEY --config wrangler.control-tower.jsonc

      - name: Deploy exact Git-attributed Control Tower
        run: >-
          npx wrangler deploy --config wrangler.control-tower.jsonc
          --var GITHUB_CLIENT_ID:${GITHUB_CLIENT_ID}
          --tag "git-${GITHUB_SHA}"
          --message "GitHub Actions Control Tower ${GITHUB_SHA} run ${GITHUB_RUN_ID}"

      - name: Verify OAuth boundary and synthetic read-only access
        env:
          CONTROL_TOWER_REQUIRE_LIVE: "true"
          CONTROL_TOWER_BEARER_TOKEN: ${{ secrets.CONTROL_TOWER_QUALIFICATION_TOKEN }}
        run: node scripts/check-control-tower-deployment.mjs

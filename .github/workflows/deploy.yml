name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: project-os-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_URL: https://project-os-guard.zakaria-fadli-94.workers.dev/health
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify required deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Required Cloudflare deployment secrets are not configured in GitHub Actions."
            exit 1
          fi

      - name: Verify project
        run: npm run check

      - name: Deploy Project OS Worker
        run: npm run deploy

      - name: Verify production health
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if response=$(curl --fail --silent --show-error --max-time 15 "$HEALTH_URL"); then
              echo "$response"
              exit 0
            fi
            sleep 5
          done
          echo "Production health check failed after deployment."
          exit 1

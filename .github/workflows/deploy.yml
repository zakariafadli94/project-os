name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: project-os-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, project-os]
    permissions:
      contents: read
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_URL: https://project-os-guard.zakaria-fadli-94.workers.dev/health
    steps:
      - uses: actions/checkout@v4

      - name: Verify required deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Required Cloudflare deployment secrets are not configured in GitHub Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify project
        run: npm run check

      - name: Deploy exact Git release
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy -- \
            --tag "git-${GITHUB_SHA}" \
            --message "GitHub Actions production ${GITHUB_SHA} run ${GITHUB_RUN_ID}"

      - name: Verify exact production identity and health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if response=$(curl --fail --silent --show-error --max-time 15 "$HEALTH_URL"); then
              echo "$response"
              if RESPONSE="$response" node <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(process.env.RESPONSE ?? "null");
          const expectedSha = (process.env.GITHUB_SHA ?? "").toLowerCase();
          const expectedTag = `git-${expectedSha}`;
          const versionId = body?.worker_version_id;
          if (body?.status !== "ok") throw new Error("Production health status is not ok");
          if (!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(String(versionId ?? ""))) {
            throw new Error(`Production Worker version id is invalid: ${String(versionId)}`);
          }
          if (body?.worker_version_tag !== expectedTag) {
            throw new Error(`Production Worker tag mismatch: expected ${expectedTag}, got ${String(body?.worker_version_tag)}`);
          }
          if (body?.git_sha !== expectedSha) {
            throw new Error(`Production Git SHA mismatch: expected ${expectedSha}, got ${String(body?.git_sha)}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `DEPLOYED_WORKER_VERSION_ID=${versionId}\n`);
          console.log(`Verified exact production identity: ${versionId} ${expectedTag}`);
          NODE
              then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Production health/identity check failed after deployment."
          exit 1

      - name: Publish deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          WORKER_VERSION_ID: ${{ env.DEPLOYED_WORKER_VERSION_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          node <<'NODE'
          const token = process.env.GH_TOKEN;
          const repository = process.env.GITHUB_REPOSITORY;
          const api = process.env.GITHUB_API_URL || "https://api.github.com";
          const status = process.env.DEPLOY_STATUS;
          const commit = process.env.COMMIT_SHA;
          const workerVersionId = process.env.WORKER_VERSION_ID || "unverified";
          const runUrl = process.env.RUN_URL;
          const title = "[automation] Project OS deployment status";

          if (!token || !repository) throw new Error("GitHub Actions token or repository identity missing");

          const headers = {
            authorization: `Bearer ${token}`,
            accept: "application/vnd.github+json",
            "content-type": "application/json",
            "x-github-api-version": "2022-11-28"
          };

          async function request(url, options = {}) {
            const response = await fetch(url, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const raw = await response.text();
            let body = null;
            if (raw) {
              try { body = JSON.parse(raw); } catch { body = raw; }
            }
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status}: ${typeof body === "string" ? body : JSON.stringify(body)}`);
            }
            return body;
          }

          const query = encodeURIComponent(`${title} in:title is:issue is:open repo:${repository}`);
          const search = await request(`${api}/search/issues?q=${query}&per_page=20`);
          let issue = search.items.find((item) => item.title === title);
          if (!issue) {
            issue = await request(`${api}/repos/${repository}/issues`, {
              method: "POST",
              body: JSON.stringify({ title, body: "Automated deployment status log for Project OS production." })
            });
          }

          await request(`${api}/repos/${repository}/issues/${issue.number}/comments`, {
            method: "POST",
            body: JSON.stringify({ body: `status=${status} commit=${commit} worker_version=${workerVersionId} run=${runUrl}` })
          });
          console.log(`Published deployment status to issue #${issue.number}`);
          NODE

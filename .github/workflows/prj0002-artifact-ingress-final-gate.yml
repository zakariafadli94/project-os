name: prj0002-artifact-ingress-final-gate

on:
  push:
    branches:
      - fix/prj0002-artifact-ingress-control-boundary

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1941a6b2619ba9144dad013597e0c3e203a7273
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run types
      - name: Targeted ingress and isolation tests
        run: npx vitest run test/inbox-artifact-ingress-fairness.spec.ts test/inbox-artifact-ingress-bounds.spec.ts test/inbox-artifact-failure.spec.ts test/inbox-isolation.spec.ts
      - run: npm run check:persistence-boundary
      - run: npm run test:persistence-high-risk
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run

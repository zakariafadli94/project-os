name: prj0002-artifact-ingress-red

on:
  push:
    branches:
      - fix/prj0002-artifact-ingress-red

jobs:
  red-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx vitest run test/inbox-artifact-ingress-bounds.spec.ts

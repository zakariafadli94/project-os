name: prj0002-npm-lock-bootstrap

on:
  push:
    branches:
      - fix/prj0002-artifact-ingress-control-boundary

permissions:
  contents: write

jobs:
  bootstrap-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prj0002-artifact-ingress-control-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile under committed npm peer policy
        run: |
          cp package.json /tmp/package.json.before
          npm install --package-lock-only --ignore-scripts
          cmp --silent package.json /tmp/package.json.before
          test -f package-lock.json
      - name: Prove deterministic install from generated lock
        run: npm ci
      - name: Targeted ingress and isolation tests
        run: npx vitest run test/inbox-artifact-ingress-fairness.spec.ts test/inbox-artifact-ingress-bounds.spec.ts test/inbox-artifact-failure.spec.ts test/inbox-isolation.spec.ts
      - run: npm run check:persistence-boundary
      - run: npm run test:persistence-high-risk
      - run: npm test
      - run: npm run check
      - run: npx wrangler deploy --dry-run
      - name: Commit lockfile only after all gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --exit-code package.json || true
          git commit -m "build(PRJ-0002): add deterministic npm lockfile"
          git push origin HEAD:fix/prj0002-artifact-ingress-control-boundary

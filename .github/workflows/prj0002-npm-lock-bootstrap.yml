name: prj0002-npm-lock-bootstrap

on:
  push:
    branches:
      - fix/prj0002-artifact-ingress-control-boundary

jobs:
  diagnose-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/prj0002-artifact-ingress-control-boundary
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baseline resolver with full diagnostics
        shell: bash
        run: |
          set +e
          npm install --package-lock-only --ignore-scripts --loglevel verbose
          status=$?
          echo "baseline_status=$status"
          for f in "$HOME"/.npm/_logs/*-debug-0.log; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done
          exit 0
      - name: Peer-resolution bypass diagnostic only
        shell: bash
        run: |
          rm -f package-lock.json
          set +e
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --loglevel verbose
          status=$?
          echo "legacy_peer_status=$status"
          test ! -f package-lock.json || echo "legacy_peer_lock_generated=true"
          exit $status

name: SCHEMA R3 canary reject dispatcher

on:
  push:
    branches:
      - schema/r3-provider-v2-proof-operator

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch governed MutationGate reject
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: PRJ-0006
          CANDIDATE_ID: MUTCAND-1E671BAEB46DF9373395AF19
        run: |
          node <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const projectId = process.env.PROJECT_ID;
          const candidateId = process.env.CANDIDATE_ID;
          if (!repository || !token) throw new Error("GitHub workflow identity/token missing");
          const response = await fetch(
            `https://api.github.com/repos/${repository}/actions/workflows/mutation-candidate-reject.yml/dispatches`,
            {
              method: "POST",
              headers: {
                authorization: `Bearer ${token}`,
                accept: "application/vnd.github+json",
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28"
              },
              body: JSON.stringify({
                ref: "main",
                inputs: {
                  project_id: projectId,
                  candidate_ids_json: JSON.stringify([candidateId]),
                  confirm_reject: "true"
                }
              })
            }
          );
          const raw = await response.text();
          if (response.status !== 204) {
            throw new Error(`Workflow dispatch failed: HTTP ${response.status} ${raw}`);
          }
          console.log(`Dispatched governed candidate.reject for ${projectId} / ${candidateId}`);
          NODE

name: SCHEMA R3 duplicate reject cleanup

on:
  push:
    branches:
      - schema/r3-provider-v2-proof-operator

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel duplicate reject run if still active
        env:
          GH_TOKEN: ${{ github.token }}
          DUPLICATE_RUN_ID: "33272311230"
        run: |
          node <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const runId = process.env.DUPLICATE_RUN_ID;
          const headers = {
            authorization: `Bearer ${token}`,
            accept: "application/vnd.github+json",
            "content-type": "application/json",
            "x-github-api-version": "2022-11-28"
          };
          const run = await fetch(`https://api.github.com/repos/${repository}/actions/runs/${runId}`, { headers });
          if (!run.ok) throw new Error(`Run inspection failed: HTTP ${run.status} ${await run.text()}`);
          const body = await run.json();
          if (body.status === "completed") {
            console.log(`Duplicate run ${runId} already completed (${body.conclusion}); no cancellation needed.`);
            process.exit(0);
          }
          const cancel = await fetch(`https://api.github.com/repos/${repository}/actions/runs/${runId}/cancel`, {
            method: "POST",
            headers
          });
          if (cancel.status !== 202) throw new Error(`Cancel failed: HTTP ${cancel.status} ${await cancel.text()}`);
          console.log(`Cancellation requested for duplicate run ${runId}.`);
          NODE
